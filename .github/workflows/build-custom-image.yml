name: Build custom Twenty image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: custom)'
        required: false
        default: 'custom'
  push:
    branches:
      - main
    paths:
      - 'packages/twenty-server/src/modules/custom/**'
      - 'packages/twenty-docker/twenty/Dockerfile'
      - '.github/workflows/build-custom-image.yml'

jobs:
  build:
    name: Build linux/amd64 and push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/twenty:${{ inputs.tag || 'custom' }}
            ghcr.io/${{ steps.owner.outputs.name }}/twenty:custom-${{ github.sha }}
          build-args: |
            APP_VERSION=v2.3.0-custom
          cache-from: type=gha
          cache-to: type=gha,mode=max
